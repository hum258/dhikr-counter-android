name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.hum258 --project-name dhikr_counter .
      - name: Configure Android speech recognition visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          query = """    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          """
          if "<queries>" not in s:
              s = s.replace("<application", query + "    <application", 1)
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application", permission + "    <application", 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dhikr-counter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
